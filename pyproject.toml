[project]
name = "omavoi"
version = "0.1.0"
description = "Voice dictation for Omarchy / Hyprland — push-to-talk speech to text, injected into any window"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }

dependencies = [
    "numpy>=1.26",
    "faster-whisper>=1.1.0",
]

[project.optional-dependencies]
# CT2 needs cuDNN 9 / cuBLAS at runtime; Omarchy ships neither system-wide.
cuda = [
    "nvidia-cublas-cu12>=12.8",
    "nvidia-cudnn-cu12>=9.1",
]

[project.scripts]
omavoi = "omavoi.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omavoi"]
